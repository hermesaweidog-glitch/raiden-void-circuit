<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#050816">
  <title>RAIDEN Scene Lab · Stage 1</title>
  <link rel="stylesheet" href="./scene-preview.css">
</head>
<body>
  <main class="scene-lab">
    <section class="preview-shell">
      <header class="preview-head">
        <div>
          <small>RAIDEN · VOID CIRCUIT</small>
          <h1>STAGE 1 SCENE LAB</h1>
        </div>
        <div class="preview-badges"><span>霓虹外環</span><span id="fps-label">60 FPS</span></div>
      </header>
      <div class="canvas-wrap">
        <canvas id="scene" width="480" height="800" aria-label="第一關場景預覽"></canvas>
      </div>
      <footer class="preview-foot">
        <span>大型側景：遠／中／近／最近四層＋海市蜃樓起伏</span>
        <span>速度層：路燈＋中央格線</span>
      </footer>
    </section>

    <aside class="control-panel" aria-label="場景調整控制">
      <div class="panel-title">
        <div><small>LIVE PARAMETERS</small><h2>場景調整</h2></div>
        <button id="reset-button" type="button">重設</button>
      </div>

      <details open>
        <summary>整體</summary>
        <label class="control-row"><span>動畫</span><input id="paused" type="checkbox"></label>
        <label class="control-row"><span>顯示格線</span><input id="show-grid" type="checkbox" checked></label>
        <label class="control-row"><span>顯示路燈</span><input id="show-posts" type="checkbox" checked></label>
        <label class="control-row"><span>顯示飛機定位</span><input id="show-ship" type="checkbox" checked></label>
        <label class="control-row"><span>顯示裁切線</span><input id="show-guides" type="checkbox"></label>
        <label>背景亮度 <output id="background-output"></output><input id="background" type="range" min="0.2" max="1.4" step="0.02"></label>
        <label>整體速度 <output id="speed-output"></output><input id="speed" type="range" min="0" max="2" step="0.02"></label>
        <label>道路上端寬度 <output id="road-top-output"></output><input id="road-top" type="range" min="0.08" max="0.50" step="0.01"></label>
        <label>道路中段寬度 <output id="road-mid-output"></output><input id="road-mid" type="range" min="0.38" max="0.88" step="0.01"></label>
        <label>道路下端寬度 <output id="road-bottom-output"></output><input id="road-bottom" type="range" min="0.72" max="0.99" step="0.01"></label>
      </details>

      <details open data-layer="far">
        <summary>遠景層</summary>
        <label>高度 <output id="far-y-output"></output><input id="far-y" type="range" min="0.05" max="0.42" step="0.005"></label>
        <label>縮放 <output id="far-scale-output"></output><input id="far-scale" type="range" min="0.35" max="2.6" step="0.01"></label>
        <label>透明度 <output id="far-alpha-output"></output><input id="far-alpha" type="range" min="0" max="1" step="0.01"></label>
        <label>起伏幅度 <output id="far-amp-output"></output><input id="far-amp" type="range" min="0" max="30" step="1"></label>
        <label>起伏頻率 <output id="far-frequency-output"></output><input id="far-frequency" type="range" min="0.2" max="3" step="0.05"></label>
      </details>

      <details open data-layer="mid">
        <summary>中景層</summary>
        <label>高度 <output id="mid-y-output"></output><input id="mid-y" type="range" min="0.12" max="0.62" step="0.005"></label>
        <label>縮放 <output id="mid-scale-output"></output><input id="mid-scale" type="range" min="0.45" max="2.8" step="0.01"></label>
        <label>透明度 <output id="mid-alpha-output"></output><input id="mid-alpha" type="range" min="0" max="1" step="0.01"></label>
        <label>起伏幅度 <output id="mid-amp-output"></output><input id="mid-amp" type="range" min="0" max="35" step="1"></label>
        <label>起伏頻率 <output id="mid-frequency-output"></output><input id="mid-frequency" type="range" min="0.2" max="3" step="0.05"></label>
      </details>

      <details open data-layer="near">
        <summary>近景層</summary>
        <label>高度 <output id="near-y-output"></output><input id="near-y" type="range" min="0.22" max="0.78" step="0.005"></label>
        <label>縮放 <output id="near-scale-output"></output><input id="near-scale" type="range" min="0.6" max="3" step="0.01"></label>
        <label>透明度 <output id="near-alpha-output"></output><input id="near-alpha" type="range" min="0" max="1" step="0.01"></label>
        <label>起伏幅度 <output id="near-amp-output"></output><input id="near-amp" type="range" min="0" max="40" step="1"></label>
        <label>起伏頻率 <output id="near-frequency-output"></output><input id="near-frequency" type="range" min="0.2" max="3" step="0.05"></label>
      </details>


      <details open data-layer="closest">
        <summary>最近景層</summary>
        <label>高度 <output id="closest-y-output"></output><input id="closest-y" type="range" min="0.24" max="0.68" step="0.005"></label>
        <label>縮放 <output id="closest-scale-output"></output><input id="closest-scale" type="range" min="0.6" max="2.4" step="0.01"></label>
        <label>透明度 <output id="closest-alpha-output"></output><input id="closest-alpha" type="range" min="0" max="1" step="0.01"></label>
        <label>起伏幅度 <output id="closest-amp-output"></output><input id="closest-amp" type="range" min="0" max="30" step="1"></label>
        <label>起伏頻率 <output id="closest-frequency-output"></output><input id="closest-frequency" type="range" min="0.15" max="2" step="0.05"></label>
      </details>

      <details open>
        <summary>速度物件</summary>
        <label>路燈速度 <output id="post-speed-output"></output><input id="post-speed" type="range" min="0.25" max="2" step="0.05"></label>
        <label>路燈數量 <output id="post-count-output"></output><input id="post-count" type="range" min="3" max="14" step="1"></label>
        <label>路燈尺寸 <output id="post-scale-output"></output><input id="post-scale" type="range" min="0.5" max="1.8" step="0.05"></label>
      </details>

      <div class="panel-actions">
        <button id="copy-button" type="button">複製參數 JSON</button>
        <button id="download-button" type="button">下載參數</button>
      </div>
      <p id="status" class="status">參數會自動儲存在此瀏覽器。</p>
    </aside>
  </main>
  <script type="module" src="./src/scene-preview.js?v=74"></script>
</body>
</html>
